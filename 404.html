    * {

    body {
      font-family: 'Oxygen', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      border-bottom: 1px solid #2a2a2a;

    }
    
    nav {
      max-width: 1200px;
      margin: 0 auto;

    nav a {
      color: #e5e5e5;
      text-decoration: none;

    nav a:hover {

    main {
      flex: 1;

      flex-direction: column;

      justify-content: center;
      text-align: center;
      padding: 2em 5vw;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    h1 {
      font-size: clamp(4em, 8vw, 8em);
      font-weight: 700;
      margin-bottom: 0.2em;
      line-height: 1;
    }
    
    h2 {
      font-size: clamp(1.5em, 3vw, 2em);
      font-weight: 600;
      margin-bottom: 0.5em;
    }
    
    p {
      font-size: clamp(1em, 1.5vw, 1.2em);
      color: #b0b0b0;
      margin-bottom: 2em;
      max-width: 500px;
      line-height: 1.6;
    }
    
    .button {
      display: inline-block;
      padding: 0.75em 2em;
      font-size: 1em;
      font-weight: 600;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #0f0f0f;
      color: #e5e5e5;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
      margin-bottom: 3em;
    }
    
    .button:hover {
      background: #e5e5e5;
      color: #0f0f0f;
    }
    
    .links {
      display: flex;
      gap: 2em;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.95em;
    }
    
    .links a {
      color: #b0b0b0;
      text-decoration: underline;
      transition: opacity 0.25s;
    }
    
    .links a:hover {
      opacity: 0.7;
    }
    
    footer {
      border-top: 1px solid #2a2a2a;
      padding: 3em 5vw;
      text-align: center;
      color: #808080;
      font-size: 0.9em;
    }
    
    /* Light theme */
    @media (prefers-color-scheme: light) {
      body {
        background: #fffefe;
        color: #333;
      }
      
      header {
        border-bottom-color: #e5e5e5;
      }
      
      nav a {
        color: #333;
      }
      
      p {
        color: #555;
      }
      
      .button {
        border-color: #e5e5e5;
        background: #fffefe;
        color: #333;
      }
      
      .button:hover {
        background: #333;
        color: #fffefe;
      }
      
      .links a {
        color: #555;
      }
      
      footer {
        border-top-color: #e5e5e5;
        color: #888;
